[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antaigent"
version = "0.1.0"
description = "A local learner agent: point it at a folder of code or data and ask questions about it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "pathspec>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
antai = "antaigent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/antaigent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
