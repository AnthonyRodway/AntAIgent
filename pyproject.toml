[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antaigent"
version = "0.2.0"
description = "A local learner agent: point it at a folder of code or data and ask questions about it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "pathspec>=0.12",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.0",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "defusedxml>=0.7",  # openpyxl uses it, when installed, to read workbooks safely
    "pypdf>=7.0",  # newer releases cap how far a PDF's streams can expand
    "watchfiles>=0.21",
    "markdown-it-py>=3.0",
    "pygments>=2.17",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
antai = "antaigent.cli:app"

[project.gui-scripts]
antai-gui = "antaigent.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antaigent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
